name: Android Auto Build & Release APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK (Debug & Release)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Environment and Default Keystore
        run: |
          if [ -f .env.example ] && [ ! -f .env ]; then
            cp .env.example .env
          fi
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f debug.keystore ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          # Ensure release build uses identical default keystore if no custom key provided
          if [ ! -f my-upload-key.jks ]; then
            cp debug.keystore my-upload-key.jks
          fi
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || 'android' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'android' }}

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace
        env:
          KEYSTORE_PATH: debug.keystore
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || 'android' }}
          KEY_ALIAS: androiddebugkey
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'android' }}

      - name: Build Release APK
        run: gradle assembleRelease --stacktrace
        env:
          KEYSTORE_PATH: debug.keystore
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || 'android' }}
          KEY_ALIAS: androiddebugkey
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'android' }}

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: 1TouchMailist-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: 1TouchMailist-Release-APK
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
